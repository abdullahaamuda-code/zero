[project]
name = "backtalk"
version = "1.0.0"
description = "Zero: Autonomous AI Operator & Build Partner with real-time voice, reactive holographic HUD face, and persistent markdown memory."
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "kokoro>=0.9.0",
    # Apple Silicon only: runs the SAME whisper model on the GPU.
    "mlx-whisper>=0.4.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26.0",
    "pynput>=1.8.0",
    "setuptools<81",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    # Windows binary wheels for webrtcvad
    "webrtcvad>=2.0.10 ; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10 ; sys_platform == 'win32'",
    "edge-tts>=6.1.0",
    "pydub>=0.25.1",
]

[tool.setuptools]
packages = ["backtalk"]

[tool.uv]
package = false
